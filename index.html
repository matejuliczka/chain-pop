<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy · Zásady ochrany soukromí</title>
  <meta name="description" content="Privacy Policy – choose your language. Zásady ochrany soukromí – vyberte jazyk.">
  <link rel="alternate" hreflang="en" href="privacy/en/">
  <link rel="alternate" hreflang="cs" href="privacy/cs/">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5f6878;
      --border: #dfe3ea;
      --accent: #2f6fed;
      --accent-soft: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e9edf3;
        --muted: #9aa3b2;
        --border: #2c3340;
        --accent: #6b9bff;
        --accent-soft: #1f2b45;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 28px;
    }
    .langs {
      display: grid;
      gap: 12px;
    }
    a.lang {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    a.lang:hover, a.lang:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    a.lang.suggested {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .code {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
    }
    .name { font-weight: 600; }
    .hint { color: var(--muted); font-size: .9rem; }
    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Privacy Policy</h1>
    <p class="sub">Zásady ochrany soukromí</p>

    <nav class="langs" aria-label="Language / Jazyk">
      <a class="lang" href="privacy/en/" hreflang="en" lang="en" data-lang="en">
        <span class="code">EN</span>
        <span>
          <span class="name">English</span><br>
          <span class="hint">Read the Privacy Policy</span>
        </span>
      </a>
      <a class="lang" href="privacy/cs/" hreflang="cs" lang="cs" data-lang="cs">
        <span class="code">CS</span>
        <span>
          <span class="name">Čeština</span><br>
          <span class="hint">Přečíst zásady ochrany soukromí</span>
        </span>
      </a>
    </nav>

    <footer>
      <!-- Sem doplň název firmy a kontakt -->
      © 2026 Název firmy · <a href="mailto:kontakt@example.com" style="color:inherit">kontakt@example.com</a>
    </footer>
  </main>

  <script>
    // Zvýrazní jazyk podle nastavení prohlížeče (bez automatického přesměrování)
    (function () {
      var langs = (navigator.languages || [navigator.language || "en"]).map(function (l) {
        return l.toLowerCase().slice(0, 2);
      });
      var pick = langs.indexOf("cs") !== -1 && (langs.indexOf("en") === -1 || langs.indexOf("cs") < langs.indexOf("en")) ? "cs" : "en";
      var el = document.querySelector('a.lang[data-lang="' + pick + '"]');
      if (el) el.classList.add("suggested");
    })();
  </script>
</body>
</html>
